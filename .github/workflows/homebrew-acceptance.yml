name: Homebrew public API acceptance

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release-fixture tag to validate and publish to the fixture tap.
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Checkout fixture tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve source identity
        id: source
        env:
          TAG: ${{ inputs.tag }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "fixture tag must be stable SemVer vX.Y.Z: $TAG" >&2
            exit 1
          fi
          COMMIT="$(git rev-parse HEAD)"
          if [ "$COMMIT" != "$EVENT_SHA" ]; then
            echo "run this acceptance workflow from the same fixture tag: tag=$COMMIT event=$EVENT_SHA" >&2
            exit 1
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  check-source:
    needs: resolve
    uses: jinyongp/homebrew-actions/.github/workflows/check.yml@ade0d1973f718aa8c954adfe402b9512ac657563 # v2.0.0
    with:
      tap-repository: jinyongp/homebrew-tap-fixture
      spec-path: .github/homebrew/source-formula.yml

  check-release:
    needs: resolve
    uses: jinyongp/homebrew-actions/.github/workflows/check.yml@ade0d1973f718aa8c954adfe402b9512ac657563 # v2.0.0
    with:
      tap-repository: jinyongp/homebrew-tap-fixture
      spec-path: .github/homebrew/formula.yml

  publish-source:
    needs:
      - resolve
      - check-source
    uses: jinyongp/homebrew-actions/.github/workflows/publish.yml@ade0d1973f718aa8c954adfe402b9512ac657563 # v2.0.0
    with:
      commit: ${{ needs.resolve.outputs.commit }}
      version: ${{ needs.resolve.outputs.version }}
      tap-repository: jinyongp/homebrew-tap-fixture
      spec-path: .github/homebrew/source-formula.yml
    secrets:
      tap_deploy_key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

  publish-release:
    needs:
      - resolve
      - check-release
    uses: jinyongp/homebrew-actions/.github/workflows/publish.yml@ade0d1973f718aa8c954adfe402b9512ac657563 # v2.0.0
    with:
      commit: ${{ needs.resolve.outputs.commit }}
      version: ${{ needs.resolve.outputs.version }}
      tap-repository: jinyongp/homebrew-tap-fixture
      spec-path: .github/homebrew/formula.yml
    secrets:
      tap_deploy_key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

  verify:
    needs:
      - resolve
      - publish-source
      - publish-release
    runs-on: ubuntu-24.04
    steps:
      - name: Check reusable workflow outputs
        env:
          SOURCE_FORMULA: ${{ needs.publish-source.outputs.formula }}
          SOURCE_VERSION: ${{ needs.publish-source.outputs.version }}
          SOURCE_STATE: ${{ needs.publish-source.outputs.state }}
          RELEASE_FORMULA: ${{ needs.publish-release.outputs.formula }}
          RELEASE_VERSION: ${{ needs.publish-release.outputs.version }}
          RELEASE_STATE: ${{ needs.publish-release.outputs.state }}
          EXPECTED_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          [ "$SOURCE_FORMULA" = "release-source-fixture" ]
          [ "$SOURCE_VERSION" = "$EXPECTED_VERSION" ]
          [ "$RELEASE_FORMULA" = "release-fixture" ]
          [ "$RELEASE_VERSION" = "$EXPECTED_VERSION" ]
          for state in "$SOURCE_STATE" "$RELEASE_STATE"; do
            case "$state" in
              published|unchanged) ;;
              *) echo "unexpected publish state: $state" >&2; exit 1 ;;
            esac
          done

      - name: Checkout destination tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jinyongp/homebrew-tap-fixture
          path: tap
          persist-credentials: false

      - name: Verify published Formulae
        env:
          COMMIT: ${{ needs.resolve.outputs.commit }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail

          test -f tap/Formula/release-source-fixture.rb
          grep -Fq 'class ReleaseSourceFixture < Formula' tap/Formula/release-source-fixture.rb
          grep -Fq "/archive/$COMMIT.tar.gz" tap/Formula/release-source-fixture.rb

          test -f tap/Formula/release-fixture.rb
          grep -Fq 'class ReleaseFixture < Formula' tap/Formula/release-fixture.rb
          grep -Fq "/releases/download/v$VERSION/" tap/Formula/release-fixture.rb
